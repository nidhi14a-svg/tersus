[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tersus"
version = "0.1.0"
description = "A Python data-cleaning and data-quality library built on top of Pandas"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    { name = "Nidhi Singh", email = "nidhi14a@gmail.com" },
]
keywords = ["data-cleaning", "data-quality", "pandas", "data-validation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# Lower bounds reflect versions actually exercised by the test suite
# (pandas 2.2.3/numpy 1.26.4 and pandas 3.0.6/numpy 2.5.3); pandas<2.0 is
# untested and not claimed as supported.
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/nidhi14a-svg/tersus"
Repository = "https://github.com/nidhi14a-svg/tersus"

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tersus*"]
exclude = ["tests*", "example*"]

[tool.setuptools.package-data]
tersus = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
