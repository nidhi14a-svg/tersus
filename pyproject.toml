[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tersus"
version = "0.1.0"
description = "A Python data-cleaning and data-quality library built on top of Pandas"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tersus*"]
exclude = ["tests*", "example*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
